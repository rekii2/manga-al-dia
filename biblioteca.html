<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Hace que en el móvil la página se vea a su tamaño real, sin alejarse -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca - Manga al Día</title>
    <!-- Conecta la hoja de estilos. La ruta es relativa a este archivo -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Cabecera: se repite igual en las tres páginas -->
    <header class="cabecera">
        <!-- Caja interior: alinea logo y enlace con la columna del contenido -->
        <div class="cabecera__interior">
            <a href="index.html" class="cabecera__logo">Manga al Día</a>

            <nav class="cabecera__nav">
                <a href="index.html">Inicio</a>
            </nav>
        </div>
    </header>

    <main class="contenedor">
        <!-- Título principal de la página -->
        <h1 class="pagina__titulo">Mi biblioteca</h1>

        <!-- Pestañas de filtro por estado. aria-pressed="true" marca la activa -->
        <div class="pestanas">
            <!-- data-estado: qué estado filtra cada pestaña. Los números los calcula JavaScript -->
            <button type="button" class="pestana" data-estado="leyendo" aria-pressed="true">Leyendo <span class="pestana__numero">0</span></button>
            <button type="button" class="pestana" data-estado="pendiente" aria-pressed="false">Pendiente <span class="pestana__numero">0</span></button>
            <button type="button" class="pestana" data-estado="terminada" aria-pressed="false">Terminada <span class="pestana__numero">0</span></button>
            <button type="button" class="pestana" data-estado="abandonada" aria-pressed="false">Abandonada <span class="pestana__numero">0</span></button>
        </div>

        <!-- Lista de series de la pestaña activa -->
        <ul class="biblioteca">
            <!-- Mensaje cuando la pestaña no tiene series. Empieza oculto (hidden) -->
            <p class="biblioteca__vacia" hidden></p>
        </ul>
    </main>

    <!-- Guarda y lee la biblioteca del usuario -->
    <script src="js/storage.js"></script>
    <!-- Pinta la pantalla. Va después porque usa funciones de storage.js -->
    <script src="js/ui.js"></script>
</body>
</html>
