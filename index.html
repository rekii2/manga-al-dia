<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Hace que en el móvil la página se vea a su tamaño real, sin alejarse -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga al Día</title>
    <!-- Conecta la hoja de estilos. La ruta es relativa a este archivo -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Cabecera: se repetirá igual en las tres páginas -->
    <header class="cabecera">
        <!-- Logo + nombre. De momento solo texto; el logo irá aquí más adelante -->
        <a href="index.html" class="cabecera__logo">Manga al Día</a>

        <!-- Navegación entre páginas -->
        <nav class="cabecera__nav">
            <a href="biblioteca.html">Mi biblioteca</a>
        </nav>
    </header>

    <!-- Contenido principal de la página: aquí irá el buscador -->
    <main class="contenedor">
        <form class="buscador" role="search">
            <label for="busqueda" class="visualmente-oculto">Buscar serie</label>
            <input
                type="search"
                id="busqueda"
                name="q"
                class="buscador__input"
                placeholder="Solo Leveling, One Piece..."
                autocomplete="off"
                required
            >
            <button type="submit" class="buscador__boton">Buscar</button>
        </form>
    </main>
</body>
</html>
