<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Hace que en el móvil la página se vea a su tamaño real, sin alejarse -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga al Día</title>
    <!-- Conecta la hoja de estilos. La ruta es relativa a este archivo -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Cabecera: se repite igual en las tres páginas -->
    <header class="cabecera">
        <!-- Caja interior: alinea logo y enlace con la columna del contenido -->
        <div class="cabecera__interior">
            <a href="index.html" class="cabecera__logo">Manga al Día</a>

            <nav class="cabecera__nav">
                <a href="biblioteca.html">Mi biblioteca</a>
                <a href="cuenta.html">Mi cuenta</a>
            </nav>
        </div>
    </header>

    <!-- Contenido principal de la página: aquí irá el buscador -->
    <main class="contenedor">
        <form class="buscador" role="search">
            <label for="busqueda" class="visualmente-oculto">Buscar serie</label>
            <input
                type="search"
                id="busqueda"
                name="q"
                class="buscador__input"
                placeholder="Solo Leveling, One Piece..."
                autocomplete="off"
                required
            >
            <button type="submit" class="buscador__boton">Buscar</button>
        </form>
        
        <!-- Resultados de la búsqueda. Empieza oculta (hidden) hasta que se busca algo.
             aria-live: los lectores de pantalla anuncian los cambios de esta zona -->
        <section class="resultados" aria-live="polite" hidden>
            <h2 class="resultados__titulo">Resultados</h2>

            <!-- Mensajes: "Cargando…", "No hay resultados", errores -->
            <p class="resultados__mensaje" hidden></p>

            <!-- Los resultados los crea JavaScript (js/ui.js) -->
            <ul class="resultados__lista"></ul>
        </section>
    </main>
    <!-- Habla con la API de AniList -->
    <script src="js/api.js"></script>
    <!-- Pinta la pantalla. Va después porque usa funciones de api.js -->
    <script src="js/ui.js"></script>
</body>
</html>
