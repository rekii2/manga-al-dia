<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Hace que en el móvil la página se vea a su tamaño real, sin alejarse -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- JavaScript lo cambia por el nombre de la serie al cargarla -->
    <title>Ficha de serie · Manga al Día</title>
    <!-- Conecta la hoja de estilos. La ruta es relativa a este archivo -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Cabecera: se repite igual en las tres páginas -->
    <header class="cabecera">
        <!-- Caja interior: alinea logo y enlace con la columna del contenido -->
        <div class="cabecera__interior">
            <a href="index.html" class="cabecera__logo">Manga al Día</a>

            <nav class="cabecera__nav">
                <a href="biblioteca.html">Mi biblioteca</a>
                <a href="cuenta.html">Mi cuenta</a>
            </nav>
        </div>
    </header>

    <main class="contenedor">

        <!-- Mensaje mientras carga la serie, o si hay un error -->
        <p class="ficha__mensaje" id="mensaje-ficha" aria-live="polite">Cargando…</p>

        <!-- La ficha empieza oculta (hidden). JavaScript la rellena con los datos de AniList y la muestra.
             Los id sirven para que JavaScript encuentre cada hueco que tiene que rellenar -->
        <article class="ficha" id="ficha" hidden>

            <!-- Imagen de fondo de la serie (banner). Es decorativa: alt vacío -->
            <div class="ficha__banner">
                <img alt="" class="ficha__banner-img" id="ficha-banner">
            </div>

            <!-- Portada + bloque del usuario, uno al lado del otro -->
            <div class="ficha__cabecera">
                <img alt="" class="ficha__portada" id="ficha-portada">

                <!-- Bloque "tuyo": añadir, estado y progreso.
                     JavaScript enseña unas partes u otras según si la serie está en tu biblioteca -->
                <div class="ficha__usuario">
                    <!-- Se ve solo si la serie NO está en tu biblioteca -->
                    <button type="button" class="boton boton--principal" id="boton-anadir">Añadir a la lista</button>

                    <!-- A partir de aquí, solo se ve si la serie SÍ está en tu biblioteca (empiezan hidden) -->
                    <label for="estado" class="visualmente-oculto">Mi estado</label>
                    <select id="estado" class="ficha__estado" hidden>
                        <option value="leyendo">Leyendo</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="terminada">Terminada</option>
                        <option value="abandonada">Abandonada</option>
                    </select>

                    <!-- Progreso: capítulo actual / total, con el +1 al lado -->
                    <div class="progreso" id="progreso-ficha" hidden>
                        <p class="progreso__texto" id="progreso-ficha-texto"></p>
                        <button type="button" class="boton boton--mas" id="boton-mas-ficha" aria-label="Sumar un capítulo">+1</button>
                    </div>

                    <button type="button" class="boton boton--secundario" id="boton-quitar" hidden>Quitar de la lista</button>
                    
                    <!-- Errores al guardar (por ejemplo, sin conexión). Empieza oculto -->
                    <p class="ficha__error" id="error-usuario" aria-live="polite" hidden></p>
                </div>
                </div>
            </div>

            <!-- Título de la serie: el más importante de la página -->
            <h1 class="ficha__titulo" id="ficha-titulo"></h1>

            <!-- Fila de 4 datos. <dl> es una "lista de definiciones": pares nombre → valor -->
            <dl class="datos">
                <div class="dato">
                    <dt>Capítulos</dt>
                    <dd id="dato-capitulos"></dd>
                </div>
                <div class="dato">
                    <dt>Publicación</dt>
                    <dd id="dato-publicacion"></dd>
                </div>
                <div class="dato">
                    <dt>Años</dt>
                    <dd id="dato-anios"></dd>
                </div>
                <div class="dato">
                    <dt>Nota</dt>
                    <dd id="dato-nota"></dd>
                </div>
            </dl>

            <!-- Géneros como etiquetas (las crea JavaScript) -->
            <ul class="generos" id="ficha-generos" aria-label="Géneros"></ul>

            <!-- Descripción de la serie -->
            <section class="sinopsis">
                <h2 class="sinopsis__titulo">Descripción</h2>
                <p id="ficha-descripcion"></p>
            </section>

        </article>

    </main>

    <!-- Habla con la API de AniList -->
    <script src="js/api.js"></script>
    <!-- Librería oficial de Supabase (desde una CDN). Crea la variable "supabase" -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Conexión con Supabase y funciones de cuentas -->
    <script src="js/auth.js"></script>
    <!-- Guarda y lee la biblioteca del usuario (en Supabase) -->
    <script src="js/storage.js"></script>
    <!-- Pinta la pantalla. Va después porque usa funciones de los otros dos -->
    <script src="js/ui.js"></script>
</body>
</html>
